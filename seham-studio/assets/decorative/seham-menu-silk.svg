<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" fill="none" preserveAspectRatio="xMinYMin meet" aria-hidden="true">
  <title>Seham Latino — menu silk</title>
  <defs>
    <!-- Paint dissolves before geometry ends — no hard tip -->
    <linearGradient id="ms-silk" gradientUnits="userSpaceOnUse" x1="-10" y1="120" x2="210" y2="175">
      <stop stop-color="#F6DADB" stop-opacity="0"/>
      <stop offset=".16" stop-color="#E8B8C0" stop-opacity=".18"/>
      <stop offset=".36" stop-color="#C77A8E" stop-opacity=".52"/>
      <stop offset=".56" stop-color="#F8E0DD" stop-opacity=".68"/>
      <stop offset=".78" stop-color="#B65F79" stop-opacity=".14"/>
      <stop offset="1" stop-color="#F4D5D7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ms-fold" gradientUnits="userSpaceOnUse" x1="0" y1="115" x2="200" y2="170">
      <stop stop-color="#8F3656" stop-opacity="0"/>
      <stop offset=".16" stop-color="#C9899A" stop-opacity=".28"/>
      <stop offset=".48" stop-color="#FFF0E8" stop-opacity=".6"/>
      <stop offset=".74" stop-color="#B86580" stop-opacity=".18"/>
      <stop offset="1" stop-color="#F6D4D8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ms-veil" gradientUnits="userSpaceOnUse" x1="8" y1="112" x2="185" y2="162">
      <stop stop-color="#F6DADB" stop-opacity="0"/>
      <stop offset=".18" stop-color="#D9A0AB" stop-opacity=".24"/>
      <stop offset=".48" stop-color="#F8E0DD" stop-opacity=".46"/>
      <stop offset=".8" stop-color="#C77A8E" stop-opacity=".1"/>
      <stop offset="1" stop-color="#F4D5D7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ms-edge" gradientUnits="userSpaceOnUse" x1="-8" y1="118" x2="215" y2="178">
      <stop stop-color="#FFF8F3" stop-opacity="0"/>
      <stop offset=".14" stop-color="#FFF0E7" stop-opacity=".5"/>
      <stop offset=".48" stop-color="#F8D9D9" stop-opacity=".68"/>
      <stop offset=".82" stop-color="#B87C7A" stop-opacity=".22"/>
      <stop offset="1" stop-color="#B87C7A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!--
    One scarf gesture, three nested folds.
    Left tip: already transparent (soft bleed).
    Right tip: paint gone by ~x 200 — clears logo.
    Thickness ~12–18 — elongated, not a C-hook.
  -->

  <path
    d="M-22 130
       C28 88 90 72 145 84
       C185 94 210 122 218 152
       C222 166 216 176 204 174
       C214 162 212 144 200 128
       C182 104 155 90 120 86
       C75 80 30 92 -4 122
       C-10 128 -16 134 -22 130
       Z"
    fill="url(#ms-silk)"/>

  <path
    d="M-10 126
       C34 90 88 78 140 88
       C175 96 196 120 202 146
       C206 158 200 166 190 164
       C198 154 198 140 188 126
       C174 106 150 94 118 92
       C80 88 42 98 12 120
       C6 124 0 128 -10 126
       Z"
    fill="url(#ms-fold)"
    opacity=".94"/>

  <path
    d="M6 122
       C42 94 86 84 130 92
       C160 98 176 118 180 140
       C182 150 176 156 168 154
       C174 146 174 134 166 122
       C156 106 138 96 112 94
       C82 92 50 100 26 116
       C20 120 14 124 6 122
       Z"
    fill="url(#ms-veil)"
    opacity=".9"/>

  <path
    d="M-18 128
       C30 86 92 70 146 84
       C186 96 212 126 216 154"
    stroke="url(#ms-edge)"
    stroke-width="1.1"
    stroke-linecap="round"/>
  <path
    d="M-2 124
       C38 92 90 80 138 90
       C170 98 192 122 198 148"
    stroke="url(#ms-edge)"
    stroke-width="0.65"
    stroke-linecap="round"
    opacity=".72"/>
</svg>
